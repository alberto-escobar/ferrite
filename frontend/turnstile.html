<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Ferrite</title>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #0f0f0f;
      color: #e8e8e8;
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 40px 32px;
      background: #1a1a1a;
      border: 1px solid #2e2e2e;
      border-radius: 12px;
      text-align: center;
    }

    h1 {
      font-size: 18px;
      font-weight: 500;
      color: #c8a96e;
    }

    p {
      font-size: 13px;
      color: #888888;
      max-width: 280px;
    }
  </style>
</head>
<body>
  <form id="turnstile-form" class="card" method="POST" action="/turnstile/verify">
    <h1>Ferrite</h1>
    <p>Verifying you're human before letting you in.</p>
    <div
      class="cf-turnstile"
      data-sitekey="{{SITE_KEY}}"
      data-callback="onTurnstileSuccess"
    ></div>
  </form>
  <script>
    function onTurnstileSuccess() {
      document.getElementById('turnstile-form').submit();
    }
  </script>
</body>
</html>
