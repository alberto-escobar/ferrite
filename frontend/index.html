<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Ferrite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #0f0f0f;
      --surface:    #1a1a1a;
      --card:       #222222;
      --card-hover: #2a2a2a;
      --border:     #2e2e2e;
      --gold:       #c8a96e;
      --gold-dim:   #8a7048;
      --text:       #e8e8e8;
      --text-muted: #888888;
      --player-h:   88px;
      --sidebar-w:  240px;
    }

    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; font-size: 14px; overflow: hidden; }

    /* ── Layout ── */
    .layout {
      display: grid;
      grid-template-columns: var(--sidebar-w) 1fr;
      grid-template-rows: 1fr var(--player-h);
      height: 100vh;
      height: 100dvh;
    }

    /* ── Sidebar ── */
    .sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 24px 0;
      grid-row: 1;
    }

    .logo {
      padding: 0 20px 24px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }

    .logo h1 {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--gold);
    }

    .logo p {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
      letter-spacing: 0.04em;
    }

    .nav-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      padding: 0 20px 8px;
      text-transform: uppercase;
    }

    .nav-item {
      padding: 9px 20px;
      cursor: pointer;
      color: var(--text-muted);
      transition: color 0.15s, background 0.15s;
      font-weight: 400;
    }

    .nav-item:hover, .nav-item.active {
      color: var(--text);
      background: var(--card);
    }

    .nav-item.active { color: var(--gold); }

    /* ── Main ── */
    .main {
      overflow-y: auto;
      padding: 32px;
      grid-column: 2;
      grid-row: 1;
    }

    .main::-webkit-scrollbar { width: 6px; }
    .main::-webkit-scrollbar-track { background: transparent; }
    .main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .section-title {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 20px;
      color: var(--text);
    }

    /* ── Track list ── */
    .track-list { width: 100%; border-collapse: collapse; }

    .track-list thead tr {
      border-bottom: 1px solid var(--border);
    }

    .track-list th {
      text-align: left;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      padding: 8px 12px;
    }

    .track-row {
      cursor: pointer;
      border-radius: 4px;
      transition: background 0.1s;
    }

    .track-row:hover { background: var(--card-hover); }
    .track-row.playing { background: var(--card); }

    .track-row td {
      padding: 10px 12px;
      color: var(--text-muted);
      font-size: 13px;
    }

    .track-row td.title {
      color: var(--text);
      font-weight: 500;
    }

    .track-row.playing td.title { color: var(--gold); }

    .track-num {
      width: 40px;
      text-align: center;
      font-family: monospace;
      font-size: 12px;
    }

    .track-duration {
      font-family: monospace;
      font-size: 12px;
      text-align: right;
      padding-right: 8px !important;
    }

    /* Equalizer bars */
    .eq-bars {
      display: none;
      gap: 2px;
      align-items: flex-end;
      height: 14px;
      width: 16px;
      margin: 0 auto;
    }

    .eq-bars span {
      display: block;
      width: 3px;
      background: var(--gold);
      border-radius: 1px;
      animation: eq 0.8s ease-in-out infinite alternate;
    }

    .eq-bars span:nth-child(1) { animation-delay: 0s; }
    .eq-bars span:nth-child(2) { animation-delay: 0.2s; }
    .eq-bars span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes eq {
      from { height: 3px; }
      to   { height: 14px; }
    }

    .track-row.playing .track-index-num { display: none; }
    .track-row.playing .eq-bars { display: flex; }

    /* Empty state */
    .empty {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-muted);
    }

    .empty h2 { font-size: 18px; margin-bottom: 8px; color: var(--text); }
    .empty p { font-size: 13px; line-height: 1.6; }

    /* ── Download / import ── */
    .download-form {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      max-width: 640px;
    }

    .download-form input[type=text] {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
    }

    .download-form input[type=text]:focus {
      outline: none;
      border-color: var(--gold-dim);
    }

    .download-submit {
      background: var(--gold);
      color: #000;
      border: none;
      border-radius: 6px;
      padding: 0 20px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .download-submit:hover { background: #d4b87a; }
    .download-submit:disabled { opacity: 0.6; cursor: not-allowed; }

    .download-error {
      color: #e07b7b;
      font-size: 12px;
      margin-bottom: 16px;
      min-height: 16px;
    }

    .download-empty {
      color: var(--text-muted);
      font-size: 13px;
      padding: 24px 0;
    }

    .download-url-cell {
      max-width: 400px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .status-pending     { background: rgba(136,136,136,0.15); color: var(--text-muted); }
    .status-in_progress { background: rgba(200,169,110,0.15); color: var(--gold); }
    .status-done        { background: rgba(88,166,120,0.15); color: #6cbf84; }
    .status-failed      { background: rgba(200,90,90,0.15); color: #e07b7b; }

    .download-error-row {
      color: var(--text-muted);
      font-size: 11px;
      font-family: monospace;
      padding: 4px 12px 12px !important;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* ── Player bar ── */
    .player {
      grid-column: 1 / -1;
      grid-row: 2;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 24px;
      gap: 24px;
    }

    .player-info {
      min-width: 200px;
      flex: 0 0 200px;
    }

    .player-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-artist {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-controls {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .control-buttons {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .ctrl-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      transition: color 0.15s;
      padding: 4px;
    }

    .ctrl-btn:hover { color: var(--text); }

    .ctrl-btn.play-pause {
      background: var(--gold);
      color: #000;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, transform 0.1s;
    }

    .ctrl-btn.play-pause:hover { background: #d4b87a; transform: scale(1.05); }

    .progress-row {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      max-width: 500px;
    }

    .time {
      font-family: monospace;
      font-size: 11px;
      color: var(--text-muted);
      min-width: 36px;
    }

    .time.right { text-align: right; }

    input[type=range] {
      -webkit-appearance: none;
      flex: 1;
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--gold);
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .progress-row:hover input[type=range]::-webkit-slider-thumb { opacity: 1; }

    input[type=range].progress { background: linear-gradient(to right, var(--gold) var(--pct, 0%), var(--border) var(--pct, 0%)); }

    .volume-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 140px;
    }

    .vol-icon { color: var(--text-muted); font-size: 16px; }

    audio { display: none; }

    /* ── Mobile menu toggle ── */
    .menu-toggle {
      display: none;
      position: fixed;
      top: 16px;
      left: 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 18px;
      cursor: pointer;
      padding: 6px 10px;
      z-index: 30;
    }

    .sidebar-overlay {
      display: none;
    }

    /* ── Mobile layout ── */
    @media (max-width: 768px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .menu-toggle { display: block; }

      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: var(--player-h);
        width: 220px;
        transform: translateX(-100%);
        transition: transform 0.2s ease;
        z-index: 20;
      }

      .sidebar.open { transform: translateX(0); }

      .sidebar-overlay {
        position: fixed;
        inset: 0 0 var(--player-h) 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 10;
      }

      .sidebar-overlay.open { display: block; }

      .main {
        grid-column: 1;
        padding: 16px;
        padding-top: 64px;
      }

      .track-list-wrap {
        overflow-x: auto;
      }

      .track-list { min-width: 480px; }

      :root { --player-h: 148px; }

      .player {
        flex-direction: column;
        justify-content: center;
        padding: 10px 12px;
        padding-bottom: calc(10px + env(safe-area-inset-bottom));
        gap: 6px;
        height: calc(var(--player-h) + env(safe-area-inset-bottom));
      }

      .player-info {
        min-width: 0;
        width: 100%;
        flex: 0 0 auto;
        text-align: center;
      }

      .player-title, .player-artist {
        white-space: normal;
        overflow: visible;
        text-overflow: initial;
      }

      .player-controls { width: 100%; }

      .volume-row { display: none; }

      input[type=range]::-webkit-slider-thumb { opacity: 1; }
    }
  </style>
</head>
<body>

<div class="layout">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="logo">
      <h1>FERRITE</h1>
      <p>Your music, your server</p>
    </div>
    <div class="nav-label">Library</div>
    <div class="nav-item active" onclick="showView('tracks')">All Tracks</div>
    <div class="nav-item" onclick="showView('albums')">Albums</div>
    <div class="nav-item" onclick="showView('artists')">Artists</div>
    <div class="nav-label">Import</div>
    <div class="nav-item" onclick="showView('download')">Add Music</div>
  </aside>

  <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>

  <button class="menu-toggle" onclick="toggleSidebar()" aria-label="Toggle menu">&#9776;</button>

  <!-- Main content -->
  <main class="main" id="main">
    <div class="empty">
      <h2>Loading your library…</h2>
    </div>
  </main>

  <!-- Player bar -->
  <footer class="player">
    <div class="player-info">
      <div class="player-title" id="player-title">—</div>
      <div class="player-artist" id="player-artist">Select a track to play</div>
    </div>

    <div class="player-controls">
      <div class="control-buttons">
        <button class="ctrl-btn" onclick="playPrev()" title="Previous">&#9664;&#9664;</button>
        <button class="ctrl-btn play-pause" id="play-pause-btn" onclick="togglePlay()">&#9654;</button>
        <button class="ctrl-btn" onclick="playNext()" title="Next">&#9654;&#9654;</button>
      </div>
      <div class="progress-row">
        <span class="time" id="current-time">0:00</span>
        <input type="range" class="progress" id="progress" min="0" max="100" value="0" oninput="seek(this.value)" />
        <span class="time right" id="total-time">0:00</span>
      </div>
    </div>

    <div class="volume-row">
      <span class="vol-icon">&#128264;</span>
      <input type="range" id="volume" min="0" max="100" value="80" oninput="setVolume(this.value)" />
    </div>

    <audio id="audio"></audio>
  </footer>

</div>

<script>
  let tracks = [];
  let currentIndex = -1;
  let currentView = 'tracks';

  const audio = document.getElementById('audio');
  const progressEl = document.getElementById('progress');
  const currentTimeEl = document.getElementById('current-time');
  const totalTimeEl = document.getElementById('total-time');
  const playPauseBtn = document.getElementById('play-pause-btn');

  // ── Fetch and render ──────────────────────────────────────────────────────

  async function init() {
    const res = await fetch('/api/tracks');
    tracks = await res.json();
    showView('tracks');
  }

  function showView(view) {
    currentView = view;
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.nav-item')[['tracks','albums','artists','download'].indexOf(view)].classList.add('active');

    if (view === 'tracks') renderTracks();
    else if (view === 'albums') renderGrouped('album', 'Albums');
    else if (view === 'artists') renderGrouped('artist', 'Artists');
    else if (view === 'download') renderDownloads();

    if (view !== 'download') stopDownloadsPolling();
    closeSidebar();
  }

  // ── Mobile sidebar ───────────────────────────────────────────────────────

  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('sidebar-overlay').classList.toggle('open');
  }

  function closeSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebar-overlay').classList.remove('open');
  }

  function renderTracks() {
    if (!tracks.length) {
      document.getElementById('main').innerHTML = `
        <div class="empty">
          <h2>No tracks found</h2>
          <p>Add audio files to your Music folder and restart Ferrite.</p>
        </div>`;
      return;
    }

    const rows = tracks.map((t, i) => `
      <tr class="track-row ${i === currentIndex ? 'playing' : ''}" onclick="playTrack(${i})">
        <td class="track-num">
          <span class="track-index-num">${i + 1}</span>
          <div class="eq-bars">
            <span></span><span></span><span></span>
          </div>
        </td>
        <td class="title">${esc(t.title)}</td>
        <td>${esc(t.artist)}</td>
        <td>${esc(t.album || '—')}</td>
        <td>${t.year || '—'}</td>
        <td class="track-duration">${formatDuration(t.duration)}</td>
      </tr>`).join('');

    document.getElementById('main').innerHTML = `
      <div class="section-title">All Tracks</div>
      <div class="track-list-wrap">
        <table class="track-list">
          <thead>
            <tr>
              <th style="width:40px">#</th>
              <th>Title</th>
              <th>Artist</th>
              <th>Album</th>
              <th>Year</th>
              <th style="text-align:right">Duration</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  }

  function renderGrouped(field, title) {
    const groups = {};
    tracks.forEach(t => {
      const key = t[field] || 'Unknown';
      if (!groups[key]) groups[key] = [];
      groups[key].push(t);
    });

    const html = Object.entries(groups).sort(([a],[b]) => a.localeCompare(b)).map(([name, items]) => `
      <div style="margin-bottom:32px">
        <div class="section-title" style="font-size:16px;margin-bottom:12px">${esc(name)}</div>
        <div class="track-list-wrap">
          <table class="track-list">
            <tbody>
              ${items.map(t => {
                const i = tracks.indexOf(t);
                return `<tr class="track-row ${i === currentIndex ? 'playing' : ''}" onclick="playTrack(${i})">
                  <td class="track-num">
                    <span class="track-index-num">${(t.track_number || '—')}</span>
                    <div class="eq-bars"><span></span><span></span><span></span></div>
                  </td>
                  <td class="title">${esc(t.title)}</td>
                  <td>${esc(t.artist)}</td>
                  <td>${t.year || '—'}</td>
                  <td class="track-duration">${formatDuration(t.duration)}</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
      </div>`).join('');

    document.getElementById('main').innerHTML = `<div class="section-title">${title}</div>${html}`;
  }

  // ── Download / import ────────────────────────────────────────────────────

  let downloadsPollTimer = null;
  let lastDownloadStatuses = {};

  async function renderDownloads() {
    document.getElementById('main').innerHTML = `
      <div class="section-title">Add Music</div>
      <form class="download-form" onsubmit="submitDownload(event)">
        <input type="text" id="download-url" placeholder="Paste a YouTube link…" autocomplete="off" required />
        <button type="submit" class="download-submit" id="download-submit-btn">Download</button>
      </form>
      <div class="download-error" id="download-error"></div>
      <div id="download-list"></div>`;

    await refreshDownloads();
  }

  async function submitDownload(event) {
    event.preventDefault();
    const input = document.getElementById('download-url');
    const btn = document.getElementById('download-submit-btn');
    const errorEl = document.getElementById('download-error');
    const url = input.value.trim();
    if (!url) return;

    errorEl.textContent = '';
    btn.disabled = true;

    try {
      const res = await fetch('/api/fetch', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url }),
      });

      if (!res.ok) {
        errorEl.textContent = 'Could not start download — check the URL and try again.';
        return;
      }

      input.value = '';
      await refreshDownloads();
    } finally {
      btn.disabled = false;
    }
  }

  async function refreshDownloads() {
    const res = await fetch('/api/downloads');
    const items = await res.json();

    const justFinished = items.some(d =>
      d.status === 'done' && lastDownloadStatuses[d.id] && lastDownloadStatuses[d.id] !== 'done'
    );
    lastDownloadStatuses = Object.fromEntries(items.map(d => [d.id, d.status]));

    renderDownloadList(items);

    if (justFinished) {
      const tracksRes = await fetch('/api/tracks');
      tracks = await tracksRes.json();
      if (currentView === 'tracks') renderTracks();
    }

    const hasActive = items.some(d => d.status === 'pending' || d.status === 'in_progress');
    if (hasActive) startDownloadsPolling();
    else stopDownloadsPolling();
  }

  function renderDownloadList(items) {
    const list = document.getElementById('download-list');
    if (!list) return;

    if (!items.length) {
      list.innerHTML = `<p class="download-empty">No downloads yet.</p>`;
      return;
    }

    const rows = items.map(d => `
      <tr>
        <td class="title download-url-cell" title="${esc(d.url)}">${esc(d.url)}</td>
        <td><span class="status-badge status-${d.status}">${statusLabel(d.status)}</span></td>
        <td>${esc(d.created_at)}</td>
      </tr>
      ${d.status === 'failed' && d.error ? `<tr><td colspan="3" class="download-error-row">${esc(d.error)}</td></tr>` : ''}
    `).join('');

    list.innerHTML = `
      <div class="track-list-wrap">
        <table class="track-list">
          <thead>
            <tr>
              <th>URL</th>
              <th style="width:120px">Status</th>
              <th style="width:160px">Submitted</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  }

  function statusLabel(status) {
    return { pending: 'Pending', in_progress: 'In Progress', done: 'Done', failed: 'Failed' }[status] || status;
  }

  function startDownloadsPolling() {
    if (downloadsPollTimer) return;
    downloadsPollTimer = setInterval(() => {
      if (currentView === 'download') refreshDownloads();
      else stopDownloadsPolling();
    }, 3000);
  }

  function stopDownloadsPolling() {
    clearInterval(downloadsPollTimer);
    downloadsPollTimer = null;
  }

  // ── Playback ──────────────────────────────────────────────────────────────

  function playTrack(index) {
    currentIndex = index;
    const track = tracks[index];
    audio.src = `/api/tracks/${track.id}/stream`;
    audio.play();
    document.getElementById('player-title').textContent = track.title;
    document.getElementById('player-artist').textContent = track.artist + (track.album ? ` · ${track.album}` : '');
    playPauseBtn.innerHTML = '&#9646;&#9646;';
    renderTracks();
  }

  function togglePlay() {
    if (!audio.src) return;
    if (audio.paused) { audio.play(); playPauseBtn.innerHTML = '&#9646;&#9646;'; }
    else { audio.pause(); playPauseBtn.innerHTML = '&#9654;'; }
  }

  function playNext() {
    if (currentIndex < tracks.length - 1) playTrack(currentIndex + 1);
  }

  function playPrev() {
    if (audio.currentTime > 3) { audio.currentTime = 0; return; }
    if (currentIndex > 0) playTrack(currentIndex - 1);
  }

  function seek(val) {
    if (audio.duration) audio.currentTime = (val / 100) * audio.duration;
  }

  function setVolume(val) {
    audio.volume = val / 100;
  }

  // ── Progress updates ──────────────────────────────────────────────────────

  audio.addEventListener('timeupdate', () => {
    if (!audio.duration) return;
    const pct = (audio.currentTime / audio.duration) * 100;
    progressEl.value = pct;
    progressEl.style.setProperty('--pct', pct + '%');
    currentTimeEl.textContent = formatDuration(Math.floor(audio.currentTime));
    totalTimeEl.textContent = formatDuration(Math.floor(audio.duration));
  });

  audio.addEventListener('ended', playNext);
  audio.addEventListener('pause', () => { playPauseBtn.innerHTML = '&#9654;'; });
  audio.addEventListener('play',  () => { playPauseBtn.innerHTML = '&#9646;&#9646;'; });

  // Set initial volume
  audio.volume = 0.8;

  // ── Helpers ───────────────────────────────────────────────────────────────

  function formatDuration(secs) {
    if (!secs && secs !== 0) return '—';
    const m = Math.floor(secs / 60);
    const s = String(Math.floor(secs % 60)).padStart(2, '0');
    return `${m}:${s}`;
  }

  function esc(str) {
    return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  init();
</script>
</body>
</html>
