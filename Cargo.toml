[package]
name = "Ferrite"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie-key-expansion", "cookie-signed"] }
dotenvy = "0.15"
lofty = "0.24.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = "1.0.228"
serde_json = "1.0.150"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "macros"] }
time = "0.3.55"
tokio = { version = "1.52.3", features = ["full"] }
uuid = "1.23.5"
walkdir = "2.5.0"

